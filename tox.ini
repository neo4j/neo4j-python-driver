[tox]
envlist =
    cov_clean
    cov_report
    py{37,38,39,310,311,312,313}-{unit-sync,unit-async,unit-mixed,integration,performance}
# for Python 3.7 support (https://github.com/tox-dev/tox/issues/3416#issuecomment-2426989929)
requires = virtualenv<20.22.0

[testenv]
passenv =
    TEST_*
    GITHUB_ACTIONS
deps = -r requirements-dev.txt
setenv =
    TEST_SUITE_NAME={envname}
usedevelop = true
warnargs =
    unit,integration: -W error -W ignore::pytest.PytestUnraisableExceptionWarning
unitargs=
    unit-sync: tests/unit/sync
    unit-async: tests/unit/async_
    unit-mixed: --ignore tests/unit/sync --ignore tests/unit/async_ tests/unit
covargs=
    unit,integration: --cov=src/neo4j --cov-append
parallel_show_output = true
commands =
    unit: python -m pytest {[testenv]covargs} --benchmark-disable {[testenv]warnargs} {posargs} {[testenv]unitargs}
    integration: python -m pytest {[testenv]covargs} --benchmark-disable {[testenv]warnargs} {posargs} tests/integration
    performance: python -m pytest --benchmark-autosave {posargs} tests/performance
depends =
    unit,integration: cov_clean

[testenv:cov_clean]
deps = -r requirements-dev.txt
skip_install = true
commands = coverage erase

[testenv:cov_report]
deps = -r requirements-dev.txt
skip_install = true
commands = coverage report --skip-empty --show-missing
depends =
    py{37,38,39,310,311,312,313}-{unit-sync,unit-async,unit-mixed,integration}
