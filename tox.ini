[tox]
envlist =
    cov_clean
    cov_report
    py{310,311,312,313,314,315}-prepare-allextras
    py{310,311,312,313,314,315}-{performance}-{allextras}
    py{311,312,313,314}-{unit-sync,unit-async,unit-mixed,integration}-{noextras,allextras}
    py{310,315}-{unit-sync,unit-async,unit-mixed,integration}-{noextras,numpy,pandas,pyarrow,http,allextras}

[cmdargs]
warnargs =
    unit,integration: -W error -W ignore::pytest.PytestUnraisableExceptionWarning
unitargs=
    unit-sync: tests/unit/sync
    unit-async: tests/unit/async_
    unit-mixed: --ignore tests/unit/sync --ignore tests/unit/async_ tests/unit
covargs=
    unit,integration: --cov=src/neo4j --cov-append

[testenv]
passenv =
    TEST_*
    GITHUB_ACTIONS
    # [bump-pyarrow] search tag when bumping pyarrow
    # (env pass-through only needed when building wheel locally)
    PYARROW_WITH_*
dependency_groups =
    test
extras =
    numpy,allextras: numpy
    pandas,allextras: pandas
    pyarrow,allextras: pyarrow
    http,allextras: http
setenv =
    TEST_SUITE_NAME={envname}
usedevelop = true
parallel_show_output = true
commands =
    unit: python -m pytest {[cmdargs]covargs} --benchmark-disable {[cmdargs]warnargs} {posargs} {[cmdargs]unitargs}
    integration: python -m pytest {[cmdargs]covargs} --benchmark-disable {[cmdargs]warnargs} {posargs} tests/integration
    performance: python -m pytest --benchmark-autosave {posargs} tests/performance
depends =
    unit,integration: cov_clean
    py310-{unit,integration}: py310-prepare-allextras
    py311-{unit,integration}: py311-prepare-allextras
    py312-{unit,integration}: py312-prepare-allextras
    py313-{unit,integration}: py313-prepare-allextras
    py314-{unit,integration}: py314-prepare-allextras
    py315-{unit,integration}: py315-prepare-allextras

# [bump-pyarrow] search tag when bumping pyarrow
# install pyarrow to build wheel and populate pip cache
# this avoids concurrent builds which helps to
#  * avoid concurrency issues in the build backend
#  * overloading the system with building the same native extension multiple
#    times (possibly in parallel)
[testenv:py{310,311,312,313,314,315}-prepare-allextras]
dependency_groups =
fail_fast = true

[testenv:cov_clean]
skip_install = true
commands = - coverage erase

[testenv:cov_report]
skip_install = true
commands = coverage report --skip-empty --show-missing
depends =
    *-unit-*
    *-integration-*
