# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-case-conflict
      - id: check-docstring-first
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: end-of-file-fixer
        exclude_types:
          - image
      - id: fix-encoding-pragma
        args: [ --remove ]
      - id: mixed-line-ending
        args: [ --fix=lf ]
        exclude_types:
          - batch
      - id: trailing-whitespace
        args: [ --markdown-linebreak-ext=md ]
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: isort
        types_or: [ python, pyi ]
        language: system
  - repo: https://github.com/sphinx-contrib/sphinx-lint
    rev: ff671d6a030a3141634793e6d1e8909ab6091830
    hooks:
      - id: sphinx-lint
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.12
    hooks:
      - id: ruff-format
      - id: ruff-check
        args: [ --fix ]
      - id: ruff-format
  - repo: local
    hooks:
      - id: unasync
        name: unasync
        entry: bin/make-unasync
        language: system
        files: "^(src/neo4j/_async|tests/(unit|integration)/async_|testkitbackend/_async)/.*"
      - id: mypy
        name: mypy static type check
        entry: mypy
        args: [ --show-error-codes, src, tests, testkitbackend, benchkit ]
        types_or: [ python, pyi ]
        language: system
        pass_filenames: false
        require_serial: true
